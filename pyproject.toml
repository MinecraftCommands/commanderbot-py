[project]
name = "commanderbot"
description = "A collection of utilities and extensions for discord.py bots."
version = "0.24.1"
requires-python = ">=3.15,<3.16"
authors = [
    { name = "Ersatz", email = "ersatz0077@gmail.com" },
    { name = "Arcensoth", email = "arcensoth@gmail.com" },
]
license = { file = "LICENSE.txt" }
readme = { file = "README.md", content-type = "text/markdown" }

keywords = ["discord", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    # Core dependencies.
    "discord-py>=2.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.14.0",
    "aiohttp>=3.14.0",
    "psutil>=7.2.0",
    "types-psutil>=7.2.0",

    # These are used for logging.
    "colorama>=0.4.0",
    "colorlog>=6.12.0",

    # The rest are for various extensions.
    "emoji>=2.16.0",
    "allay>=1.3.0",
    "mccq>=1.0.0",
    "numpy>=2.5.0",
    "opencv-python-headless>=5.0.0.0",
    "pillow>=13.0.0",
    "imagehash>=4.3.0",
    "mime-enum>=0.0.3",
]

[project.optional-dependencies]
ocr = ["tesserocr>=2.12.0"]

[project.urls]
Homepage = "https://github.com/MinecraftCommands/commanderbot-py"
Repository = "https://github.com/MinecraftCommands/commanderbot-py"
Changelog = "https://github.com/MinecraftCommands/commanderbot-py/blob/main/CHANGELOG.md"

[project.scripts]
commanderbot = "commanderbot.__main__:main"

[dependency-groups]
dev = ["ruff>=0.17.0", "ty>=0.0.91"]

[tool.ruff.lint]
ignore = [
    "UP034",  # https://docs.astral.sh/ruff/rules/extraneous-parentheses/
    "UP045",  # https://docs.astral.sh/ruff/rules/non-pep604-annotation-optional/
    "UP007",  # https://docs.astral.sh/ruff/rules/non-pep604-annotation-union/
    "E722",   # https://docs.astral.sh/ruff/rules/bare-except/
    "S110",   # https://docs.astral.sh/ruff/rules/try-except-pass/
    "S112",   # https://docs.astral.sh/ruff/rules/try-except-continue/
    "BLE001", # https://docs.astral.sh/ruff/rules/blind-except/
    "SIM102", # https://docs.astral.sh/ruff/rules/collapsible-if/
    "SIM103", # https://docs.astral.sh/ruff/rules/needless-bool/
    "SIM114", # https://docs.astral.sh/ruff/rules/if-with-same-arms/
    "SIM117", # https://docs.astral.sh/ruff/rules/multiple-with-statements/
    "B009",   # https://docs.astral.sh/ruff/rules/get-attr-with-constant/
    "FLY002", # https://docs.astral.sh/ruff/rules/static-join-to-f-string/
    "PIE796", # https://docs.astral.sh/ruff/rules/non-unique-enums/
    "PYI041", # https://docs.astral.sh/ruff/rules/redundant-numeric-union/
]

[tool.uv.build-backend]
module-name = "commanderbot"
module-root = ""

[build-system]
requires = ["uv_build<0.14"]
build-backend = "uv_build"
